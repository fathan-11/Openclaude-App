<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:linear-gradient(165deg,#FFF8F0 0%,#FFE8DD 30%,#FFD4B0 60%,#F4845F 100%);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:34px;background:#1a1a2e;border-radius:0 0 20px 20px;z-index:10}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px 0;font-size:14px;font-weight:700;color:#2D2D3A;position:relative;z-index:5}
.content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center}
.logo-container{margin-bottom:40px;animation:float 3s ease-in-out infinite}
.logo{width:120px;height:120px;background:white;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 12px 40px rgba(244,132,95,0.3)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-family:'Quicksand',sans-serif;font-size:42px;font-weight:700;color:#2D2D3A;margin-bottom:12px;line-height:1.2}
.subtitle{font-size:18px;color:#6B6B80;font-weight:500;margin-bottom:60px;line-height:1.5;max-width:280px}
.dots{display:flex;gap:8px;margin-bottom:40px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(45,45,58,0.15)}
.dot.active{width:32px;border-radius:4px;background:#F4845F}
.start-btn{width:100%;max-width:300px;padding:18px;border:none;border-radius:20px;background:linear-gradient(135deg,#F4845F,#E86F48);color:white;font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(244,132,95,0.4);transition:transform 0.2s}
.start-btn:hover{transform:scale(1.02)}
.login-link{margin-top:20px;font-size:15px;color:#6B6B80;font-weight:600}
.login-link span{color:#F4845F;cursor:pointer}
.decorative{position:absolute;bottom:-60px;right:-60px;width:200px;height:200px;background:rgba(255,255,255,0.15);border-radius:50%}
.decorative2{position:absolute;top:120px;left:-40px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="decorative"></div>
  <div class="decorative2"></div>
  <div class="status-bar"><span>9:41</span><span>●●●</span></div>
  <div class="content">
    <div class="logo-container">
      <div class="logo">🤖</div>
    </div>
    <h1 class="title">Welcome to<br>OpenClaude</h1>
    <p class="subtitle">Your AI-powered coding companion for a mindful development experience</p>
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <button class="start-btn">Get Started ✨</button>
    <div class="login-link">Already have an account? <span>Log in</span></div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#0F0F0F;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:#1A1A1A;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:34px;background:#0F0F0F;border-radius:0 0 20px 20px;z-index:10}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px 0;font-size:14px;font-weight:700;color:#F5F0E6;position:relative;z-index:5}
.content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center}
.logo-container{margin-bottom:32px;position:relative}
.logo{width:140px;height:140px;background:linear-gradient(135deg,#2A2A2A,#333);border-radius:36px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.logo::before{content:'';position:absolute;top:20px;left:20px;width:100px;height:100px;background:radial-gradient(circle,#E86F48 0%,transparent 70%);opacity:0.4}
.logo::after{content:'✦';font-size:48px;color:#E86F48;position:relative;z-index:2}
.hero-image{width:200px;height:160px;background:linear-gradient(135deg,#2A2A2A,#1A1A1A);border-radius:24px;margin-bottom:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hero-image::before{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#E86F48 0%,transparent 70%);opacity:0.3}
.hero-image::after{content:'✦';font-size:64px;color:#E86F48;position:relative;z-index:2}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:#F5F0E6;margin-bottom:12px;line-height:1.2}
.subtitle{font-size:16px;color:#888;font-weight:400;margin-bottom:48px;line-height:1.5;max-width:300px}
.start-btn{width:100%;max-width:300px;padding:18px;border:none;border-radius:16px;background:#E86F48;color:#1A1A1A;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all 200ms ease}
.start-btn:hover{transform:scale(1.02);box-shadow:0 8px 30px rgba(232,111,72,0.3)}
.login-link{margin-top:20px;font-size:14px;color:#888;font-weight:500}
.login-link span{color:#E86F48;cursor:pointer}
.decorative{position:absolute;bottom:100px;right:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(232,111,72,0.1) 0%,transparent 70%);border-radius:50%}
</style>
</head>
<body>
<div class="phone">
<div class="notch"></div>
<div class="decorative"></div>
<div class="status-bar"><span>9:41</span><span>●●●</span></div>
<div class="content">
<div class="logo-container"><div class="logo"></div></div>
<div class="hero-image"></div>
<h1 class="title">Generate a meeting from your audio & video calls.</h1>
<p class="subtitle">Create fully briefed meeting schedule in your calendar. In zero seconds.</p>
<button class="start-btn">Get Started</button>
<div class="login-link">Have account? <span>Login</span></div>
</div>
</div>
</body>
</html>

name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-sign-release:
    name: 🏭 Production Build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://play.google.com/apps/internaltest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Full Test Suite
        run: gradle testDebugUnitTest

      - name: Run Lint (Zero Warnings)
        run: gradle lintDebug --warning-mode fail

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Build Release AAB (Bundle)
        run: gradle bundleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-artifact@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign AAB
        uses: r0adkll/sign-android-artifact@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.0.0
          name: "Release v${{ github.run_number }}.0.0"
          body: |
            ## 🚀 Production Release v${{ github.run_number }}.0.0
            
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            
            ### What's Changed
            ${{ github.event.head_commit.message }}
            
            ### Download
            - 📦 `app-release.apk` — Direct install
            - 📱 `app-release.aab` — Play Store bundle
            
            ---
            *Automated release by CI/CD pipeline*
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.repopattern
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
        continue-on-error: true

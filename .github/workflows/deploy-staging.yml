name: Deploy to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-test-deploy:
    name: 🎯 Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.openclaude-app.fathan-11.dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Full Test Suite
        run: gradle testDebugUnitTest

      - name: Run Lint
        run: gradle lintDebug

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-artifact@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Staging Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: "Staging Build ${{ github.run_number }}"
          body: |
            ## 🎯 Staging Release
            
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Time:** ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

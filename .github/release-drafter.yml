name-template: 'v$RESOLVED_VERSION 🚀'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'FEAT'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'FIX'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'refactor'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🔒 Security'
    labels:
      - 'security'
      - 'vulnerability'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: 'No changes since last release.'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'chore'
  default: patch

autolabeler:
  - label: 'feature'
    title:
      - '/^FEAT/i'
      - '/^FEATURE/i'
  - label: 'fix'
    title:
      - '/^FIX/i'
      - '/^BUGFIX/i'
  - label: 'documentation'
    title:
      - '/^DOCS/i'
  - label: 'chore'
    title:
      - '/^CHORE/i'
      - '/^REFACTOR/i'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
